---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otelo11y-otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/open-telemetry/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.178.1"
    helm:
      # https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector 
      values: |
        mode: deployment
        replicaCount: 2
        image:
          repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
        readinessProbe:
          initialDelaySeconds: 3 # default 1 sec is too low

        config: # https://opentelemetry.io/docs/collector/configuration/#basics
          
          exporters:
            debug:
              verbosity: detailed

          extensions:
            # The health_check extension is mandatory for this chart.
            # Without the health_check extension the collector will fail the readiness and liveness probes.
            # The health_check extension can be modified, but should never be removed.
            health_check:
              endpoint: 0.0.0.0:13133

          processors:
            batch: {}
            # Default memory limiter configuration for the collector based on k8s resource limits.
            memory_limiter:
              # check_interval is the time between measurements of memory usage.
              check_interval: 5s
              # By default limit_mib is set to 80% of ".Values.resources.limits.memory"
              limit_percentage: 80
              # By default spike_limit_mib is set to 25% of ".Values.resources.limits.memory"
              spike_limit_percentage: 25

          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318 # instead of ${env:MY_POD_IP}:4318 to allow port-forward

          service:
            extensions:
              - health_check

            pipelines:
              logs:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - debug

              metrics:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - debug

              traces:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - debug
                


  destination:
    server: https://kubernetes.default.svc
    namespace: otelo11y-otel-collector
  
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true