---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otelo11y-otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/open-telemetry/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.178.1"
    # https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector 
    values: |
      mode: deployment
      replicaCount: 2
      image:
        repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"

  destination:
    server: https://kubernetes.default.svc
    namespace: otelo11y-otel-collector
  
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true