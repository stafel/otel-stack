---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otelo11y-otel-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/open-telemetry/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.178.1"
    helm:
      # https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector 
      values: |
        mode: daemonset # to have one on each node to read the logs
        replicaCount: 1 # Put replicas down to have easy way to check the log in argo
        image:
          repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib" # opentelemetry-collector-k8s has no 
        readinessProbe:
          initialDelaySeconds: 3 # default 1 sec is too low

        config: # https://opentelemetry.io/docs/collector/configuration/#basics

          exporters:
            debug:
              verbosity: detailed

            otlp_http/tempo:
              endpoint: "otelo11y-tempo.otelo11y-tempo.svc.cluster.local"

            prometheus_remote_write:
              http:
                endpoint: "http://otelo11y-prometheus-server.otelo11y-prometheus.svc.cluster.local/api/v1/write"

          extensions:
            # The health_check extension is mandatory for this chart.
            # Without the health_check extension the collector will fail the readiness and liveness probes.
            # The health_check extension can be modified, but should never be removed.
            health_check:
              endpoint: 0.0.0.0:13133

          processors:
            batch: {}
            # Default memory limiter configuration for the collector based on k8s resource limits.
            memory_limiter:
              # check_interval is the time between measurements of memory usage.
              check_interval: 5s
              # By default limit_mib is set to 80% of ".Values.resources.limits.memory"
              limit_percentage: 80
              # By default spike_limit_mib is set to 25% of ".Values.resources.limits.memory"
              spike_limit_percentage: 25

          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318 # instead of ${env:MY_POD_IP}:4318 to allow port-forward

          service:
            extensions:
              - health_check

            telemetry:
              metrics:
                level: normal          # none | basic | normal | detailed
                readers:
                  - periodic: # this sets the own metrics to push
                      interval: 60000   # push every 60s
                      exporter:
                        otlp:
                          protocol: http/protobuf
                          endpoint: http://otelo11y-prometheus-server.otelo11y-prometheus.svc.cluster.local/api/v1/otlp/v1/metrics

            pipelines:
              logs:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - debug

              metrics:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - debug
                  - prometheus_remote_write

              traces:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - debug
                  - otlp_http/tempo
                


  destination:
    server: https://kubernetes.default.svc
    namespace: otelo11y-otel-collector
  
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true