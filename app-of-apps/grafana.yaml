---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otelo11y-grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/grafana-community/helm-charts
    chart: grafana
    targetRevision: "14.4.0"
    helm:
      # https://artifacthub.io/packages/helm/grafana-community/grafana
      values: |
        admin:
          existingSecret: "admin"
        rbac:
          create: false # dont create cluster role
        ingress:
          enabled: true
          ingressClassName: traefik # we are using traefik https://doc.traefik.io/traefik-enterprise/providers/kubernetes-ingress/
          hosts: # enter your host here
            - o11y.maus.home.arpa
          # tls: [] # secretName and hosts could be entered here
        
        datasources: # https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: tempo
                type: tempo
                uid: tempo
                access: proxy
                url: "http://otelo11y-tempo.otelo11y-tempo.svc.cluster.local:3200"

        alerting: {} # https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/

        notifiers: {} # https://grafana.com/docs/grafana/latest/administration/provisioning/#alerting

  destination:
    server: https://kubernetes.default.svc
    namespace: otelo11y-grafana

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true