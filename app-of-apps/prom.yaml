---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otelo11y-prometheus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/prometheus-community/charts
    chart: prometheus
    targetRevision: "29.45.1"
    helm:
      # https://artifacthub.io/packages/helm/prometheus-community/prometheus
      values: |
        rbac:
          create: false # dont create cluster namespaced stuff
        server:
          extraFlags:
            - web.enable-otlp-receiver
          nodeSelector:
            kubernetes.io/arch: amd64 # prometheus does not work on arm64?

        scrapeConfigs: # what we scrape directly, https://prometheus.io/docs/prometheus/latest/configuration/configuration/#scrape_config
          prometheus:
            enabled: true
          kubernetes-api-servers:
            enabled: false
          kubernetes-nodes:
            enabled: false
          kubernetes-nodes-cadvisor:
            enabled: false
          kubernetes-service-endpoints:
            enabled: false
          kubernetes-service-endpoints-slow:
            enabled: false
          prometheus-pushgateway:
            enabled: false
          kubernetes-services:
            enabled: false
          kubernetes-pods:
            enabled: false
          kubernetes-pods-slow:
            enabled: false

        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        kube-state-metrics:
          enabled: false
        networkPolicy:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: otelo11y-prometheus
  
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true