---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otelo11y-tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/grafana-community/helm-charts
    chart: tempo
    targetRevision: "1.24.4"
    helm:
      # https://artifacthub.io/packages/helm/grafana-community/tempo
      # values: |
        
    destination:
      server: https://kubernetes.default.svc
      namespace: otelo11y-tempo

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true